[project]
name = "wcpan-drive-client-media"
version = "0.1.0"
description = "local media probing for wcpan.drive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
authors = [{ name = "Wei-Cheng Pan", email = "legnaleurc@gmail.com" }]
dependencies = [
    "wcpan-drive-client>=0.1.0,<0.2.0",
    "python-magic>=0.4.27,<0.5.0",
    "pymediainfo>=7.0.1,<8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcpan"]
