[project]
name = "wcpan-drive-server"
version = "0.1.0"
description = "Mirrored HTTP file server for wcpan.drive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
authors = [{ name = "Wei-Cheng Pan", email = "legnaleurc@gmail.com" }]
dependencies = [
    "aiohttp>=3.13.0,<4.0.0",
    "aiofile>=3.9.0,<4.0.0",
    "caio>=0.9.0,<1.0.0",
    "dacite>=1.9.2,<2.0.0",
    "pyyaml>=6.0,<7.0",
    "pymediainfo>=7.0.1,<8.0.0",
    "wcpan-logging>=2.1.0,<3.0.0",
    "wcpan-drive-protocol>=0.1.0,<0.2.0",
    "wcpan-synology>=0.2.0,<0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcpan"]
