[project]
name = "wcpan-drive-server"
version = "0.1.0"
description = "Mirrored HTTP file server for wcpan.drive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
authors = [{ name = "Wei-Cheng Pan", email = "legnaleurc@gmail.com" }]
dependencies = [
    "wcpan-drive-sqlite>=0.1.0,<0.2.0",
    "aiohttp>=3.13.0,<4.0.0",
    "dacite>=1.9.2,<2.0.0",
    "pyyaml>=6.0,<7.0",
    "wcpan-drive-plugin>=0.1.0,<0.2.0",
    "wcpan-drive-protocol>=0.1.0,<0.2.0",
    "wcpan-logging>=2.1.0,<3.0.0",
    "wcpan-synology>=0.8.0,<0.9.0",
]

[project.urls]
Homepage = "https://github.com/legnaleurc/wcpan.drive"
Source = "https://github.com/legnaleurc/wcpan.drive/tree/master/packages/server"
Issues = "https://github.com/legnaleurc/wcpan.drive/issues"

[project.scripts]
"wcpan.drive.server" = "wcpan.drive.server._main:main"

[project.entry-points."wcpan.drive.server.backend"]
filesystem = "wcpan.drive.server.backend.filesystem:create_backend"
synology = "wcpan.drive.server.backend.synology:create_backend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcpan"]

# The server must not depend on client packages; see docs/architecture.md.
# Workspace installs every member, so tests cannot catch it. The boundary between
# the core and its backends is checked by tests/test_backend_boundary.py.
[tool.ruff]
extend = "../../ruff.toml"
# Keep isort first-party detection the same as the rest of the workspace.
src = ["../.."]

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"wcpan.drive.client".msg = "the server must not depend on client packages"
