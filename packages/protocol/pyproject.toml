[project]
name = "wcpan-drive-protocol"
version = "0.1.0"
description = "HTTP wire models and helpers for wcpan.drive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
authors = [{ name = "Wei-Cheng Pan", email = "legnaleurc@gmail.com" }]
dependencies = [
]

[project.urls]
Homepage = "https://github.com/legnaleurc/wcpan.drive"
Source = "https://github.com/legnaleurc/wcpan.drive/tree/master/packages/protocol"
Issues = "https://github.com/legnaleurc/wcpan.drive/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcpan"]
