[project]
name = "wcpan-drive-client-cli"
version = "0.1.0"
description = "command line tool for wcpan.drive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
authors = [{ name = "Wei-Cheng Pan", email = "legnaleurc@gmail.com" }]
dependencies = [
    "PyYAML>=6.0.1,<7.0.0",
    "wcpan-drive-client>=0.1.0,<0.2.0",
    "wcpan-drive-client-config>=0.1.0,<0.2.0",
    "wcpan-drive-client-media>=0.1.0,<0.2.0",
    "wcpan-logging>=2.0.3,<3.0.0",
    "wcpan-queue>=7.2.1,<8.0.0",
    "prompt-toolkit>=3.0.0,<4.0.0",
]

[project.scripts]
"wcpan.drive.client.cli" = "wcpan.drive.client.cli._main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcpan"]
