[project]
name = "wcpan-drive-client-sqlite"
version = "0.1.0"
description = "SQLite cache for wcpan.drive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
authors = [{ name = "Wei-Cheng Pan", email = "legnaleurc@gmail.com" }]
dependencies = [
    "wcpan-drive-client>=0.1.0,<0.2.0",
]

[project.entry-points."wcpan.drive.client.cache"]
sqlite = "wcpan.drive.client.sqlite:create_cache"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcpan"]
