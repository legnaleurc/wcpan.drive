[project]
name = "wcpan-drive-client-crypt"
version = "0.1.0"
description = "crypt middleware for wcpan.drive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
authors = [{ name = "Wei-Cheng Pan", email = "legnaleurc@gmail.com" }]
dependencies = [
    "wcpan-drive-client>=0.1.0,<0.2.0",
    "numpy>=2.2.3,<3.0.0",
]

[project.entry-points."wcpan.drive.client.backend"]
crypt = "wcpan.drive.client.crypt:create_middleware"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcpan"]
