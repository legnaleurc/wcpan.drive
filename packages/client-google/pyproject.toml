[project]
name = "wcpan-drive-client-google"
version = "0.1.0"
description = "Google Drive driver for wcpan.drive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
authors = [{ name = "Wei-Cheng Pan", email = "legnaleurc@gmail.com" }]
dependencies = [
    "aiohttp>=3.13.3,<4.0.0",
    "wcpan-drive-client>=0.1.0,<0.2.0",
]

[project.urls]
Homepage = "https://github.com/legnaleurc/wcpan.drive"
Source = "https://github.com/legnaleurc/wcpan.drive/tree/master/packages/client-google"
Issues = "https://github.com/legnaleurc/wcpan.drive/issues"

[project.entry-points."wcpan.drive.client.backend"]
google = "wcpan.drive.client.google:create_backend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcpan"]
