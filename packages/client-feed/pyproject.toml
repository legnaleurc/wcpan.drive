[project]
name = "wcpan-drive-client-feed"
version = "0.1.0"
description = "Client backend for the self-hosted wcpan.drive.server feed server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
authors = [{ name = "Wei-Cheng Pan", email = "legnaleurc@gmail.com" }]
dependencies = [
    "aiohttp>=3.13.0,<4.0.0",
    "pycryptodome>=3.0,<4.0",
    "wcpan-drive-client>=0.1.0,<0.2.0",
    "wcpan-drive-protocol>=0.1.0,<0.2.0",
]

[project.entry-points."wcpan.drive.client.backend"]
feed = "wcpan.drive.client.feed:create_backend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcpan"]
