[project]
name = "wcpan-drive-server-filesystem"
version = "0.1.0"
description = "Local filesystem backend for wcpan.drive.server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
authors = [{ name = "Wei-Cheng Pan", email = "legnaleurc@gmail.com" }]
dependencies = [
    "aiohttp>=3.13.0,<4.0.0",
    "dacite>=1.9.2,<2.0.0",
    "wcpan-drive-protocol>=0.1.0,<0.2.0",
    "wcpan-drive-server>=0.1.0,<0.2.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcpan"]
