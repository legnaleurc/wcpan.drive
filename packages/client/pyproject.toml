[project]
name = "wcpan-drive-client"
version = "0.1.0"
description = "asynchronous generic cloud drive library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
authors = [{ name = "Wei-Cheng Pan", email = "legnaleurc@gmail.com" }]
dependencies = [
    "wcpan-drive-sqlite>=0.1.0,<0.2.0",
]

[project.urls]
Homepage = "https://github.com/legnaleurc/wcpan.drive"
Source = "https://github.com/legnaleurc/wcpan.drive/tree/master/packages/client"
Issues = "https://github.com/legnaleurc/wcpan.drive/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcpan"]
