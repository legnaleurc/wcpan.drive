# Example configuration for wcpan.drive.server.
# Copy to server.yaml (or another path) and adjust values.
#
# Run (install the backend packages this file names):
#   wcpan.drive.server --config /path/to/server.yaml serve
#   uvx --with=wcpan-drive-server-synology --with=wcpan-drive-server-filesystem \
#       wcpan.drive.server --config /path/to/server.yaml serve
#
# Other commands use the same file: gc, squash, and commands of one backend
# instance, such as `backend nas backfill /photos`; see `backend NAME --help`.

# Config schema version. The current version is 3; version 2 files (a single
# Synology server) are still accepted.
version: 3

server:
  # HTTP bind address (default: 127.0.0.1)
  host: "0.0.0.0"
  # HTTP port (default: 8080)
  port: 8080
  # SQLite database path.
  database_url: "/data/mirror.db"
  # Optional: log file path for wcpan.logging (omit for stderr-only).
  # log_path: "/var/log/wcpan-drive-server.log"
  # Optional: directory for temporary upload files (defaults to system temp dir).
  # upload_tmp_dir: "/tmp/wcpan-uploads"

# Backend instances by name. "type" is the backend factory; the rest are its
# settings. A name identifies the instance; keep it stable.
backends:
  nas:
    type: wcpan.drive.server.synology.create_backend
    # Synology DSM / Drive API base URL (scheme + host + port if needed).
    url: "https://nas.example.com:5001"
    username: "your-drive-user"
    password: "your-password"
    # Optional: TOTP code if the account uses 2FA (when required by the API).
    # otp_code: "123456"
    webhook:
      # Externally reachable base URL of this server; the webhook is
      # registered at <callback_url>/api/v1/backends/<backend name>/webhook.
      callback_url: "https://my-server.example.com"
      # Stable identifier for this app's webhook registration
      # (default: wcpan-drive-server-synology).
      # app_id: "wcpan-drive-server-synology"
    # Optional: Synology path prefix -> host path, for media metadata probing.
    # local_paths:
    #   "/volume1/photos": "/mnt/nas/photos"

  disk:
    type: wcpan.drive.server.filesystem.create_backend
    # Seconds between full rescans (default: 3600).
    # rescan_interval: 3600
    # Follow changes with inotify (default: true).
    # watch: true
    # Reject every change through the server (default: false).
    # read_only: false
    # Optional: source path prefix -> host path for media probing
    # (default: probe the source paths themselves).
    # local_paths:
    #   "/srv/documents": "/mnt/documents"

# Mounts by name; each appears as /<name> (virtual node id "_<name>").
# "source" is interpreted by the backend: a Synology path, or an absolute
# host directory for the filesystem backend.
mounts:
  photos:
    backend: nas
    source: "/volume1/photos"
  documents:
    backend: disk
    source: "/srv/documents"
